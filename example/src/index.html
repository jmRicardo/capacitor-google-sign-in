<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Google Sign-In example</title>
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0" />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0;
        padding: calc(env(safe-area-inset-top) + 16px) 16px 16px;
      }
      button {
        display: block;
        width: 100%;
        margin: 8px 0;
        padding: 12px;
        font-size: 16px;
      }
      label {
        display: block;
        margin: 8px 0;
      }
      input[type='text'] {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        font-size: 16px;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-all;
        background: #f2f2f2;
        padding: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Google Sign-In</h1>
    <label>Hosted domain (optional) <input id="hostedDomain" type="text" autocapitalize="off" /></label>
    <label>Hint, iOS only (optional) <input id="hint" type="text" autocapitalize="off" /></label>
    <button id="signIn">Sign in</button>
    <button id="bottomSheet">Sign in with the bottom sheet (Android)</button>
    <button id="noNonce">Sign in without a nonce</button>
    <button id="signOut">Sign out</button>
    <pre id="output">Ready.</pre>
    <script src="./js/app.js" type="module"></script>
  </body>
</html>
